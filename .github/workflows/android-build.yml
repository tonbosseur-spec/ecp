name: Build Android APK
on:
  push:
    branches:
      - '*'
      - '*/*'
      - '**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: admin
            app_name: "ECP admin"
            app_id: "com.excellerchezpierre.admin"
            artifact_name: "ECP-Admin-Android-APK"
          - target: client
            app_name: "Exceller chez Pierre"
            app_id: "com.excellerchezpierre.app"
            artifact_name: "Exceller-Chez-Pierre-Android-APK"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npm install @tailwindcss/oxide-linux-x64-gnu || true
      - name: Create .env File
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_APP_TARGET=${{ matrix.target }}" >> .env
      - name: Validate required secrets
        run: |
          [[ -z "${{ secrets.VITE_SUPABASE_URL }}" ]] && echo "⚠️ VITE_SUPABASE_URL missing" && exit 1
          [[ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]] && echo "⚠️ VITE_SUPABASE_ANON_KEY missing" && exit 1
      - name: Modify Capacitor Config
        run: |
          sed -i "s/appName:\s*['\"].*['\"]/appName: '${{ matrix.app_name }}'/" capacitor.config.ts
          sed -i "s/appId:\s*['\"].*['\"]/appId: '${{ matrix.app_id }}'/" capacitor.config.ts
      - name: Verify npm scripts
        run: |
          npm run generate-assets --if-present
          npm run build --if-present
      - name: Generate Native Assets
        run: npm run generate-assets || true
      - name: Build Web Application
        run: npm run build
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      - name: Install Android Platform tools & SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
      - name: Prepare Android platform
        run: bash scripts/prepare-android.sh "${{ matrix.app_name }}"
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
