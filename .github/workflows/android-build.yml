name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Annule automatiquement les anciens builds si un nouveau démarre
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: admin
            app_name: "ECP admin"
            app_id: "com.excellerchezpierre.admin"
            artifact_name: "ECP-Admin-Android-APK"

          - target: client
            app_name: "Exceller chez Pierre"
            app_id: "com.excellerchezpierre.app"
            artifact_name: "Exceller-Chez-Pierre-Android-APK"

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        timeout-minutes: 10
        run: |
          npm ci --legacy-peer-deps

      - name: Create .env File
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_APP_TARGET=${{ matrix.target }}" >> .env

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "VITE_SUPABASE_URL missing"
            exit 1
          fi

          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "VITE_SUPABASE_ANON_KEY missing"
            exit 1
          fi

      - name: Modify Capacitor Config
        run: |
          sed -i "s/appName:.*/appName: '${{ matrix.app_name }}',/" capacitor.config.ts
          sed -i "s/appId:.*/appId: '${{ matrix.app_id }}',/" capacitor.config.ts

      - name: Generate Assets
        run: |
          npm run generate-assets --if-present

      - name: Build Web Application
        timeout-minutes: 15
        run: |
          npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Android platform
        timeout-minutes: 10
        run: |
          bash scripts/prepare-android.sh "${{ matrix.app_name }}"

      - name: Fix Corrupt Gradle Wrapper
        working-directory: android
        run: |
          wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar

      - name: Build Android APK
        timeout-minutes: 40
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7